<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Průvodce Azerothem – WoW Midnight pro nováčky</title>
<meta name="description" content="Vyber rasu, classu a specializaci a získej kompletní návod: kouzla, rotace, talenty, gear, buffy a videa. World of Warcraft: Midnight.">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 58 14v18c0 15-11 25-26 29C17 57 6 47 6 32V14z' fill='%23140f07' stroke='%23e8b64c' stroke-width='3'/%3E%3Cpath d='M32 14 38 30 32 50 26 30z' fill='%23e8b64c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --panel:rgba(14,16,28,.78); --panel-solid:#0e101c; --line:rgba(232,182,76,.22);
  --gold:#e8b64c; --gold-2:#f6d98f; --text:#ece6d6; --muted:#a39d8e; --faint:#6d6a61;
  --accent:#e8b64c; --accent-rgb:232,182,76;
  --alliance:#3a7bd5; --horde:#c0392b; --neutral:#9b8b6a;
  --radius:14px; --shadow:0 20px 50px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--gold-2)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3,.cinzel{font-family:Cinzel,Georgia,serif;letter-spacing:.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- POZADÍ ---------- */
#bg-video{position:fixed;inset:0;z-index:-3;overflow:hidden;opacity:0;transition:opacity 1.6s ease;pointer-events:none}
#bg-video.on{opacity:.38}
#bg-video iframe{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%) scale(1.15);border:0}
#bg-canvas{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
#bg-veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(var(--accent-rgb),.10),transparent 60%),
             linear-gradient(180deg,rgba(7,8,15,.35) 0%,rgba(7,8,15,.75) 55%,rgba(7,8,15,.95) 100%);
  transition:background 1s}

/* ---------- HLAVIČKA ---------- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,40px);
  background:linear-gradient(180deg,rgba(7,8,15,.92),rgba(7,8,15,.6));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:Cinzel;font-weight:900;font-size:18px;color:var(--gold-2);text-decoration:none;white-space:nowrap}
.logo svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(232,182,76,.5))}
.logo small{display:block;font:500 10px/1 Inter;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.top .spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;transition:.2s}
.toggle:hover{color:var(--text);border-color:var(--accent)}
.toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.toggle[aria-pressed="true"] .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ---------- STEPPER ---------- */
.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:18px 16px 0}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(14,16,28,.6);font-size:13px;color:var(--muted);transition:.25s}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.06)}
.step.done{color:var(--text)} .step.done .n{background:var(--accent);color:#111}
.step.active{color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.step.active .n{background:rgba(var(--accent-rgb),.25);color:var(--gold-2)}
.step[disabled]{opacity:.45;cursor:default}
.step b{font-weight:600;color:var(--text)}

main{max-width:1180px;margin:0 auto;padding:18px clamp(16px,4vw,40px) 80px}
.screen{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen-head{text-align:center;margin:22px auto 26px;max-width:720px}
.screen-head h2{font-size:clamp(24px,4vw,36px);color:var(--gold-2);text-shadow:0 2px 20px rgba(0,0,0,.8)}
.screen-head p{color:var(--muted);margin-top:6px}
.ornament{display:block;width:220px;height:14px;margin:10px auto 0;opacity:.8}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:clamp(40px,10vh,110px) 0 30px}
.hero .eyebrow{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--gold);}
.hero h1{font-size:clamp(34px,7vw,74px);line-height:1.05;margin:14px 0 16px;font-weight:900;
  background:linear-gradient(180deg,#fff6dc 0%,#f0c665 55%,#9c6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(0,0,0,.9))}
.hero p.lead{max-width:640px;margin:0 auto;color:#d6cfbd;font-size:clamp(15px,2vw,18px)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:15px 34px;border-radius:10px;font-family:Cinzel;font-weight:700;font-size:17px;letter-spacing:.06em;color:#1a1204;
  background:linear-gradient(180deg,#ffe29a,#e0a73a 60%,#b27a22);box-shadow:0 0 0 1px #6b4a12 inset,0 10px 30px -8px rgba(232,182,76,.6);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #6b4a12 inset,0 14px 40px -8px rgba(232,182,76,.8)}
.cta.ghost{background:transparent;color:var(--gold-2);box-shadow:0 0 0 1px var(--line) inset}
.hero-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;max-width:900px;margin:44px auto 0}
.feat{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(6px);text-align:left}
.feat b{display:block;font-family:Cinzel;color:var(--gold-2);font-size:14px;margin-bottom:4px}
.feat span{color:var(--muted);font-size:13px}
.resume{margin-top:18px;font-size:14px;color:var(--muted)}
.resume button{color:var(--gold-2);text-decoration:underline}

/* ---------- KARTY ---------- */
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:rgba(14,16,28,.6);transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{color:#111;background:var(--accent);border-color:var(--accent);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{position:relative;text-align:left;padding:16px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--panel);backdrop-filter:blur(6px);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;overflow:hidden;--c:var(--gold)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 65%);opacity:.55;transition:opacity .3s;pointer-events:none}
.card:hover:not([disabled]){transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 14px 34px -14px color-mix(in srgb,var(--c) 60%,transparent)}
.card:hover::before{opacity:1}
.card.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent)}
.card[disabled]{opacity:.35;cursor:not-allowed;filter:grayscale(.7)}
.card .crest{width:46px;height:46px;margin-bottom:10px;position:relative}
.card h3{font-size:16px;color:var(--c);position:relative}
.card .sub{font-size:12px;color:var(--muted);position:relative}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.a{background:rgba(58,123,213,.2);color:#9cc2ff}
.tag.h{background:rgba(192,57,43,.22);color:#ff9d92}
.tag.n{background:rgba(155,139,106,.22);color:#e1d2ad}
.tag.new{background:rgba(var(--accent-rgb),.2);color:var(--gold-2)}
.tag.full{background:rgba(63,199,235,.18);color:#9fe6fa}
.class-card{min-height:150px}
.class-card .crest{width:54px;height:54px}
.spec-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.spec-card{padding:22px;min-height:190px}
.spec-card h3{font-size:22px}
.spec-card p{color:#cfc8b6;font-size:14px;margin-top:8px;position:relative}
.diff{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.diff i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.diff i.on{background:var(--c)}

/* ---------- DETAIL RASY ---------- */
.drawer{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(8px);padding:20px;display:grid;gap:16px;grid-template-columns:auto 1fr auto;align-items:center;animation:rise .4s}
.drawer h3{color:var(--gold-2);font-size:20px}
.racials{display:grid;gap:6px;margin-top:6px}
.racials div{font-size:13.5px;color:#d0c9b8}
.racials b{color:var(--text)}
@media (max-width:720px){.drawer{grid-template-columns:1fr}.drawer .crest{display:none}}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:6px}
.back:hover{color:var(--text)}

/* ---------- PRŮVODCE ---------- */
.banner{position:relative;border-radius:18px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 28%,#0b0c16) 0%,rgba(11,12,22,.9) 55%),var(--panel-solid);padding:clamp(20px,4vw,36px);display:flex;gap:22px;align-items:center;flex-wrap:wrap;--c:var(--accent)}
.banner .crest{width:88px;height:88px;flex:none;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--c) 60%,transparent))}
.banner h2{font-size:clamp(26px,4.5vw,42px);line-height:1.1}
.banner h2 span{color:var(--c)}
.banner .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner .meta .tag{font-size:12px;padding:4px 10px;background:rgba(0,0,0,.35);color:#e6dfcc}
.banner .change{margin-left:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 0;padding-bottom:2px;scrollbar-width:thin;position:sticky;top:57px;z-index:10;
  background:linear-gradient(180deg,rgba(7,8,15,.95),rgba(7,8,15,.85));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--c,var(--accent))}
.panel{margin-top:20px;animation:rise .35s}
.box{border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(8px);padding:clamp(16px,3vw,24px);margin-bottom:16px}
.box h3{font-size:18px;color:var(--gold-2);margin-bottom:10px}
.box h4{font-size:14px;margin:14px 0 6px;color:var(--text);font-family:Inter;font-weight:700}
.box p{color:#d3ccba}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
ul.clean{list-style:none;display:grid;gap:8px}
ul.clean li{position:relative;padding-left:20px;color:#d3ccba}
ul.clean li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;transform:rotate(45deg);background:var(--c,var(--accent));opacity:.8}
ul.clean.bad li::before{background:#e05b4d}
ol.prio{list-style:none;counter-reset:p;display:grid;gap:6px}
ol.prio li{counter-increment:p;display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);transition:.2s}
ol.prio li:hover{background:rgba(var(--accent-rgb),.08);border-color:rgba(var(--accent-rgb),.3)}
ol.prio li::before{content:counter(p);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(var(--accent-rgb),.18);color:var(--gold-2)}
.opener{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opener span{padding:7px 12px;border-radius:8px;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);font-size:13.5px}
.opener i{color:var(--faint);font-style:normal}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:rgba(0,0,0,.3)}
.seg button{padding:7px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#111;font-weight:600}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* kouzla */
.spell-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.spell{display:flex;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);align-items:flex-start}
.spell .ico{flex:none;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-family:Cinzel;font-weight:900;font-size:17px;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 45%),linear-gradient(145deg,var(--sc,#2a6f9b),#0a1830);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.15) inset;text-shadow:0 1px 3px #000}
.spell.has-wh .ico.fb{display:none}
.spell .name{font-weight:600;font-size:15px}
.spell .name a{color:#9fe6fa;text-decoration:none}
.spell .name a:hover{text-decoration:underline}
.spell .d{font-size:13px;color:#c3bca9;margin-top:2px}
.spell .key{margin-left:auto;flex:none;font-size:11px;font-family:ui-monospace,Menlo,monospace;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.15);color:var(--muted);align-self:center}
.cat-title{font-family:Cinzel;color:var(--gold);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 10px}
.cat-title:first-child{margin-top:0}
/* Wowhead ikony */
.spell a .iconmedium, .spell a .iconsmall{margin-right:6px}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;color:#d3ccba}
table.t td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
.tscroll{overflow-x:auto}

.statbar{display:grid;gap:8px}
.statbar div{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;font-size:14px}
.statbar span.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.statbar span.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#fff));animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}

.build{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;background:rgba(0,0,0,.25);margin-bottom:10px}
.build .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.build .row b{font-size:15px}
.build code{display:block;margin-top:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#bfe9f5;background:rgba(0,0,0,.45);padding:10px;border-radius:8px;word-break:break-all;user-select:all}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--text);text-decoration:none;transition:.2s;background:rgba(255,255,255,.03)}
.btn:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* videa */
.vids{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);
  background:radial-gradient(circle at 70% 30%,rgba(var(--accent-rgb),.35),transparent 55%),linear-gradient(135deg,#141a30,#07080f);display:grid;place-items:center;text-align:center}
.vid::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.02) 22px 23px);pointer-events:none}
.vid button{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;padding:16px;z-index:1}
.vid .play{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);border:2px solid var(--gold);transition:.25s}
.vid button:hover .play{transform:scale(1.1);background:var(--gold)}
.vid button:hover .play svg{fill:#111}
.vid .play svg{width:22px;height:22px;fill:var(--gold);margin-left:4px}
.vid .vt{font-family:Cinzel;font-size:14px;color:var(--text);text-shadow:0 1px 6px #000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}

/* ikony ze hry */
.gi{position:relative;flex:none;width:44px;height:44px;border-radius:8px;overflow:hidden;background:#0b0d18;
  box-shadow:0 0 0 1px #000,0 0 0 2px rgba(255,255,255,.18),0 4px 12px -4px #000}
.gi img{width:100%;height:100%;display:block;transform:scale(1.08)}
.gi::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -10px 16px -10px rgba(0,0,0,.8);pointer-events:none}
.gi.q4{box-shadow:0 0 0 1px #000,0 0 0 2px #a335ee,0 0 14px -2px rgba(163,53,238,.7)}
.gi .fbx{position:absolute;inset:0;display:none;place-items:center;font-family:Cinzel;font-weight:900;color:#fff;background:linear-gradient(145deg,#2a6f9b,#0a1830)}
.gi.err img{display:none}.gi.err .fbx{display:grid}

/* banner scéna */
.banner .scene{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:inherit}
.banner .scene canvas,.banner .scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .scene video{opacity:0;transition:opacity 1s}
.banner .scene video.ok{opacity:1}
.banner .scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,18,.92) 0%,rgba(8,9,18,.55) 45%,rgba(8,9,18,.05) 75%)}
.banner>*:not(.scene){position:relative;z-index:1}
.banner.has-scene{min-height:230px}
@media (max-width:640px){.banner.has-scene{min-height:300px;align-items:flex-end}.banner .scene::after{background:linear-gradient(0deg,rgba(8,9,18,.95) 0%,rgba(8,9,18,.6) 50%,rgba(8,9,18,.1) 100%)}.banner>.crest{display:none}}

/* gear – postava */
.doll{display:grid;grid-template-columns:1fr minmax(180px,260px) 1fr;gap:14px;align-items:start}
.doll .col{display:grid;gap:8px}
.doll .col.r .slot{flex-direction:row-reverse;text-align:right}
.slot{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent;cursor:help;transition:.15s;text-align:left;width:100%}
.slot:hover,.slot:focus-visible,.slot.act{background:rgba(163,53,238,.1);border-color:rgba(163,53,238,.45)}
.slot .sn{font-size:13.5px;font-weight:600;color:#c77dff;line-height:1.25}

<script>

"use strict";

const store = {

};
$("#f-patch").textContent = PATCH; $("#f-upd").textContent = UPDATED;

/* ---------- STAV ---------- */
const S = { screen:"home", race:null, cls:null, spec:null, faction:"all", tab:"overview", hero:null, rotMode:"st" };
const raceById = id => RACES.find(r => r.id===id);
const clsById = id => CLASSES.find(c => c.id===id);
const specOf = (c, id) => c && c.specs.find(s => s.id===id);
const guideOf = () => S.cls && S.spec ? GUIDES[S.cls+"/"+S.spec] : null;

function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function setAccent(hex){
  const [r,g,b] = hexRgb(hex || "#e8b64c");
  document.documentElement.style.setProperty("--accent", hex || "#e8b64c");
  document.documentElement.style.setProperty("--accent-rgb", `${r},${g},${b}`);
  BG.setColor([r,g,b]);
}

/* ---------- ROUTING (hash) ---------- */
function toHash(){
  let h = S.screen;
  if (S.screen==="class") h += "/"+S.race;
  if (S.screen==="spec") h += "/"+S.race+"/"+S.cls;
  if (S.screen==="guide") h += "/"+S.race+"/"+S.cls+"/"+S.spec+"/"+S.tab;
  if (location.hash.slice(1)!==h) history.replaceState(null,"","#"+h);
}
function fromHash(){
  const p = location.hash.slice(1).split("/");
  const scr = p[0];
  if (scr==="race"){ S.screen="race"; }
  else if (scr==="class" && raceById(p[1])){ S.screen="class"; S.race=p[1]; }
  else if (scr==="spec" && raceById(p[1]) && clsById(p[2])){ S.screen="spec"; S.race=p[1]; S.cls=p[2]; }
  else if (scr==="guide" && raceById(p[1]) && specOf(clsById(p[2]),p[3])){ S.screen="guide"; S.race=p[1]; S.cls=p[2]; S.spec=p[3]; S.tab=p[4]||"overview"; }
  else S.screen="home";
}
function go(screen){ S.screen=screen; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- SVG ERBY (vlastní, originální) ---------- */
function crest(color, letter, shape="shield"){
  const id = "g"+Math.random().toString(36).slice(2,8);
  const path = shape==="round"
    ? '<circle cx="32" cy="32" r="28"/>'
    : '<path d="M32 3 58 13v19c0 15-11 25-26 29C17 57 6 47 6 32V13z"/>';
  return `<svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#0a0b14"/></linearGradient></defs>
    <g fill="url(#${id})" stroke="${color}" stroke-width="2">${path}</g>
    <g fill="none" stroke="${color}" stroke-opacity=".35"><path d="M32 10v44M14 24h36"/></g>
    <text x="32" y="40" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="22" fill="#fff" style="paint-order:stroke" stroke="#000" stroke-width="3">${esc(letter)}</text>
  </svg>`;
}
const FACTION = { A:{n:"Aliance",c:"#3a7bd5",cl:"a"}, H:{n:"Horda",c:"#c0392b",cl:"h"}, N:{n:"Obě frakce",c:"#9b8b6a",cl:"n"} };

/* ---------- STEPPER ---------- */
function renderStepper(){
  const r = raceById(S.race), c = clsById(S.cls), sp = specOf(c,S.spec);
  const order = ["race","class","spec","guide"];
  const idx = order.indexOf(S.screen);
  const steps = [
    ["race","Rasa", r && r.name],
    ["class","Classa", c && c.name],
    ["spec","Specializace", sp && sp.name],
    ["guide","Průvodce", null],
  ];
  $("#stepper").style.display = S.screen==="home" ? "none" : "";
  $("#stepper").innerHTML = steps.map(([k,label,val],i)=>{
    const cls = i<idx ? "done" : i===idx ? "active" : "";
    const can = i<=idx || (k==="class"&&r) || (k==="spec"&&c) || (k==="guide"&&sp);
    return `<button class="step ${cls}" data-step="${k}" ${can?"":"disabled"}><span class="n">${i<idx?"✓":i+1}</span>${label}${val?`: <b>${esc(val)}</b>`:""}</button>`;
  }).join("");
}

    <div class="screen-head"><h2>Vyber si rasu</h2>${ornament}<p>Rasa ovlivňuje hlavně vzhled a pár bonusů (racialů). Pro nováčka je nejdůležitější, co se ti líbí.</p></div>

      ${[["all","Všechny"],["A","Aliance"],["H","Horda"],["N","Obě frakce"]].map(([k,l])=>`<button class="chip ${S.faction===k?"on":""}" data-faction="${k}">${l}</button>`).join("")}
    </div>
    <div class="grid">
      ${list.map(r=>{ const f=FACTION[r.faction]; return `
        <button class="card ${S.race===r.id?"sel":""}" style="--c:${f.c}" data-race="${r.id}">
          ${crest(f.c, r.name[0])}
          <h3>${esc(r.name)}</h3><div class="sub">${esc(r.cz)}</div>
          <div class="tags"><span class="tag ${f.cl}">${f.n}</span>${r.allied?`<span class="tag">Allied</span>`:""}${r.isNew?`<span class="tag new">Nové</span>`:""}</div>
        </button>`;}).join("")}
    </div>

}
function raceDrawer(r){
  const f = FACTION[r.faction];
  return `<div class="drawer" id="drawer" style="--c:${f.c}">
    ${crest(f.c, r.name[0])}
    <div><h3>${esc(r.name)} <span class="tag ${f.cl}" style="vertical-align:middle">${f.n}</span></h3>
      <div class="racials">${r.racials.map(([n,d])=>`<div><b>${esc(n)}</b> – ${esc(d)}</div>`).join("")}</div></div>
    <button class="cta" style="margin:0" data-go="class">Pokračovat</button>
  </div>`;
}

function classAllowed(c){
  const r = raceById(S.race);
  if (c.onlyRace && c.onlyRace!==S.race) return false;
  if (r && r.noClasses && r.noClasses.includes(c.id)) return false;
  return true;
}
function vClass(){
  return `<section class="screen">
    <button class="back" data-go="race">← Zpět na rasy</button>
    <div class="screen-head"><h2>Vyber si classu</h2>${ornament}<p>Classa určuje, jak bojuješ. Každá má 3 specializace (druid 4).</p></div>
    <div class="grid">
      ${CLASSES.map(c=>{ const ok = classAllowed(c); return `
        <button class="card class-card ${S.cls===c.id?"sel":""}" style="--c:${c.color}" data-cls="${c.id}" ${ok?"":"disabled title='Tato rasa nemůže hrát za tuto classu'"}>
          ${crest(c.color, c.name[0])}
          <h3>${esc(c.name)}</h3><div class="sub">${esc(c.cz)} · ${esc(c.armor)}</div>
          <div class="tags">${c.specs.map(s=>`<span class="tag">${esc(s.name)}</span>`).join("")}</div>
        </button>`;}).join("")}
    </div>
    <p class="note" style="text-align:center">Některé kombinace rasy a classy ve hře nejdou – přesné možnosti ti ukáže obrazovka tvorby postavy.</p>
  </section>`;
}

function vSpec(){
  const c = clsById(S.cls);
  return `<section class="screen" style="--c:${c.color}">
    <button class="back" data-go="class">← Zpět na classy</button>
    <div class="screen-head"><h2 style="color:${c.color}">${esc(c.name)}: specializace</h2>${ornament}<p>Specializaci můžeš ve hře kdykoli změnit u talentů.</p></div>
    <div class="grid spec-grid">
      ${c.specs.map(s=>`
        <button class="card spec-card" style="--c:${c.color}" data-spec="${s.id}">
          <h3>${esc(s.name)}</h3>
          <div class="tags"><span class="tag">${ROLE_CZ[s.role]}</span><span class="tag">${esc(s.stat)}</span>
            <span class="tag">${DIFF_CZ[s.diff]} ${diffDots(s.diff)}</span>
            ${s.full?`<span class="tag full">Kompletní průvodce</span>`:""}${s.isNew?`<span class="tag new">Nové</span>`:""}</div>
          <p>${esc(s.desc)}</p>

/* ---------- PRŮVODCE ---------- */
const TABS_FULL = [["overview","Přehled"],["spells","Kouzla"],["rotation","Rotace"],["talents","Talenty"],["gear","Gear & staty"],["buffs","Buffy & lektvary"],["content","M+ · Solo · PvP"],["media","Videa & odkazy"]];
const TABS_BASIC = [["overview","Přehled"],["talents","Talenty"],["gear","Gear & staty"],["media","Videa & odkazy"]];

function links(c, s){
  const role = s.role==="tank"?"tank":s.role==="heal"?"healing":"dps";
  const q = encodeURIComponent(`${s.name} ${c.name} guide Midnight 12.1`);
  return {
    icy:`https://www.icy-veins.com/wow/${s.id}-${c.slug}-pve-${role}-guide`,
    method:`https://www.method.gg/guides/${s.id}-${c.slug}`,
    wowhead:`https://www.wowhead.com/guide/classes/${c.slug}/${s.id}`,
    calc:`https://www.wowhead.com/talent-calc/${c.slug}/${s.id}`,
    yt:`https://www.youtube.com/results?search_query=${q}`,
    pvp:`https://www.icy-veins.com/wow/${s.id}-${c.slug}-pvp-guide`,
  };
}

function vGuide(){
  const c = clsById(S.cls), s = specOf(c,S.spec), r = raceById(S.race), g = guideOf();
  const tabs = g ? TABS_FULL : TABS_BASIC;
  if (!tabs.some(t=>t[0]===S.tab)) S.tab = "overview";
  return `<section class="screen" style="--c:${c.color}">
    <div class="banner has-scene" style="--c:${c.color}">
      <div class="scene" aria-hidden="true">${g && g.bannerVideo ? `<video autoplay muted loop playsinline preload="metadata"><source src="${g.bannerVideo}" type="video/mp4"></video>`:""}<canvas></canvas></div>
      ${crest(c.color, s.name[0])}
      <div>
        <div class="sub" style="color:var(--muted);font-size:13px">${esc(r.name)} · ${esc(c.name)}</div>
        <h2><span>${esc(s.name)}</span> ${esc(c.name)}</h2>
        <div class="meta"><span class="tag">${ROLE_CZ[s.role]}</span><span class="tag">${esc(s.stat)}</span><span class="tag">${esc(c.armor)}</span><span class="tag">Obtížnost: ${DIFF_CZ[s.diff]}</span><span class="tag">Patch ${esc(PATCH.split(" ")[0])}</span></div>
        <div class="btns" style="margin-top:14px"><button class="btn" data-go="spec">Změnit specializaci</button></div>
      </div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-tab="${k}" role="tab" aria-selected="${S.tab===k}">${l}</button>`).join("")}</div>
    <div class="panel" id="panel">${g ? fullTab(c,s,r,g) : basicTab(c,s,r)}</div>
  </section>`;
}

function racialBox(r){
  return `<div class="box"><h3>Tvoje rasa: ${esc(r.name)}</h3><div class="racials">${r.racials.map(([n,d])=>`<div><b>${esc(n)}</b> – ${esc(d)}</div>`).join("")}</div>
  <p class="note">Aktivní racial si dej na lištu a používej ho – u DPS racialů (Berserking, Blood Fury, Fireblood…) spolu s hlavním cooldownem.</p></div>`;
}
function heroBox(s, g){
  return `<div class="box"><h3>Hero talenty</h3><div class="cols">${s.hero.map((h,i)=>`
    <div><h4>${esc(h)} ${g&&i===0?`<span class="tag new">Doporučeno pro začátek</span>`:""}</h4>
    <p>${g && g.heroNote && g.heroNote[h] ? esc(g.heroNote[h]) : "Přesný popis a doporučení najdeš v odkazech níže."}</p></div>`).join("")}</div></div>`;
}

function basicTab(c,s,r){
  const L = links(c,s);
  if (S.tab==="overview") return `
    <div class="box"><h3>O specializaci</h3><p>${esc(s.desc)}</p>
      <p class="note">Kompletní průvodce (kouzla, rotace, buffy) pro ${esc(s.name)} ${esc(c.name)} připravujeme. Zatím najdeš základ a nejlepší externí návody v záložce <b>Videa & odkazy</b>.</p></div>
    <div class="cols">
      <div class="box"><h3>Základy</h3><table class="t"><tbody>
        <tr><td>Role</td><td>${ROLE_CZ[s.role]}</td></tr>
        <tr><td>Hlavní stat</td><td>${esc(s.stat)}</td></tr>
        <tr><td>Zbroj</td><td>${esc(c.armor)}</td></tr>
        <tr><td>Zbraň</td><td>${esc(s.weapon)}</td></tr>
        <tr><td>Zdroj</td><td>${esc(c.resource)}</td></tr>
      </tbody></table></div>
      <div class="box"><h3>Rady pro roli ${ROLE_CZ[s.role]}</h3><ul class="clean">${ROLE_TIPS[s.role].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    </div>
    ${heroBox(s,null)}${racialBox(r)}`;
  if (S.tab==="talents") return `${heroBox(s,null)}
    <div class="box"><h3>Strom talentů</h3><p>Otevři kalkulačku talentů – vpravo nahoře v guidech najdeš hotové buildy k importu.</p>
    <div class="btns"><a class="btn primary" href="${L.calc}" target="_blank" rel="noopener">Kalkulačka talentů ${esc(s.name)} ↗</a><a class="btn" href="${L.method}" target="_blank" rel="noopener">Buildy na Method ↗</a></div>
    <h4>Jak importovat build do hry</h4><ol class="prio"><li>Ve hře zmáčkni N (talenty).</li><li>Dole klikni na Import.</li><li>Vlož řetězec buildu a ulož jako nový loadout.</li></ol></div>`;
  if (S.tab==="gear") return `<div class="box"><h3>Gear</h3><ul class="clean">
      <li>Vždycky nejdřív vyšší item level – staty řeš až mezi věcmi se stejným ilvl.</li>
      <li>Hlavní stat: <b>${esc(s.stat)}</b>. Věci bez něj pro tebe nejsou.</li>
      <li>Zbroj: <b>${esc(c.armor)}</b>. Zbraň: <b>${esc(s.weapon)}</b>.</li>
      <li>Enchantuj vše, co jde, a do socketů dávej gemy.</li>
      <li>Přesnou prioritu statů ti dá sim na <a href="https://www.raidbots.com" target="_blank" rel="noopener">Raidbots</a>.</li></ul></div>`;
  return mediaTab(c,s,null);

const ICON = n => `https://wow.zamimg.com/images/wow/icons/large/${n}.jpg`;
function gicon(ic, fb, cls=""){
  return `<span class="gi ${cls} ${ic?"":"err"}">${ic?`<img src="${ICON(ic)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('err')">`:""}<span class="fbx">${esc(fb)}</span></span>`;
}
function spellRow(sp){
  const letter = sp.n.replace(/[^A-Za-z]/g,"").slice(0,2);
  return `<div class="spell tt" tabindex="0" data-tt="spell" data-name="${esc(sp.n)}" data-key="${esc(sp.key||"")}" data-u="${sp.u}" data-ic="${sp.ic||""}">${gicon(sp.ic, letter)}
    <div><div class="name"><a href="${sp.u}" target="_blank" rel="noopener">${esc(sp.n)}</a></div><div class="d">${esc(sp.d)}</div></div>
    ${sp.key && sp.key!=="–" ? `<span class="key" title="Doporučená klávesa">${esc(sp.key)}</span>`:""}</div>`;
}

function fullTab(c,s,r,g){
  const L = links(c,s);
  const heroes = Object.keys(g.rotations);
  if (!S.hero || !heroes.includes(S.hero)) S.hero = heroes[0];
  switch(S.tab){
  case "overview": return `
    <div class="box"><h3>V kostce</h3><p>${esc(g.summary)}</p></div>
    <div class="cols">
      <div class="box"><h3>Silné stránky</h3><ul class="clean">${g.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box"><h3>Slabé stránky</h3><ul class="clean bad">${g.weaknesses.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <div class="box"><h3>Co je v Midnight nového</h3><ul class="clean">${g.changes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="box"><h3>Mechaniky, kterým musíš rozumět</h3><p class="note" style="margin:-4px 0 12px">${HOVER_HINT} pro herní popis.</p><div class="spell-list">${g.mechanics.map(m=>`
      <div class="spell tt" tabindex="0" data-tt="spell" data-name="${esc(m.n)}" data-u="${m.u}" data-ic="${m.ic||""}">${gicon(m.ic, m.n.slice(0,2))}<div><div class="name"><a href="${m.u}" target="_blank" rel="noopener">${esc(m.n)}</a></div><div class="d">${esc(m.d)}</div><div class="d" style="color:var(--gold-2)">→ ${esc(m.t)}</div></div></div>`).join("")}</div></div>
    ${racialBox(r)}`;
  case "spells": {
    const cats = [["core","Hlavní kouzla"],["cd","Cooldowny"],["def","Obrana"],["util","Užitečná kouzla"],["buff","Buffy"]];
    return `<div class="box">${cats.map(([k,l])=>`<div class="cat-title">${l}</div><div class="spell-list">${g.spells.filter(x=>x.cat===k).map(spellRow).join("")}</div>`).join("")}
      <p class="note">${HOVER_HINT} – zobrazí se popisek jako ve hře a česky k čemu kouzlo slouží. Klávesy jsou jen návrh.</p></div>`;
  }
  case "rotation": {
    const R = g.rotations[S.hero];
    return `<div class="box">
      <div class="controls">
        <div class="seg">${heroes.map(h=>`<button class="${S.hero===h?"on":""}" data-hero="${h}">${esc(h)}</button>`).join("")}</div>
        <div class="seg"><button class="${S.rotMode==="st"?"on":""}" data-rot="st">1–2 cíle</button><button class="${S.rotMode==="aoe"?"on":""}" data-rot="aoe">3+ cílů (AoE)</button></div>
      </div>
      <p><b>Zlaté pravidlo:</b> pořád něco sesílej. Priorita se čte shora dolů – zmáčkni první řádek, který právě jde.</p>
      <h4>Opener (začátek boje)</h4><div class="opener">${R.opener.map((x,i)=>`${i?"<i>→</i>":""}<span>${esc(x)}</span>`).join("")}</div>
      <h4>Priorita – ${S.rotMode==="st"?"single target":"AoE"}</h4>
      <ol class="prio">${R[S.rotMode].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      <p class="note">Ray of Frost nech vždy doběhnout celý – předtím si stoupni tam, kde se 4 s nebudeš hýbat.</p></div>`;
  }
  case "talents": return `${heroBox(s,g)}
    <div class="box"><h3>Hotové buildy</h3><p>Klikni na <b>Zobrazit strom</b> a uvidíš celý hotový strom talentů, nebo zkopíruj řetězec a naimportuj ho do hry.</p>
    ${g.builds.map((b,i)=>`<div class="build"><div class="row"><b>${esc(b.name)}</b><span class="tag">${esc(b.hero)}</span>${b.rec?`<span class="tag new">Doporučeno</span>`:""}</div>
      <code id="b${i}">${esc(b.str)}</code>
      <div class="btns"><a class="btn primary" href="${CALC(b.str)}" target="_blank" rel="noopener">Zobrazit strom ↗</a><button class="btn" data-copy="b${i}">Kopírovat řetězec</button></div></div>`).join("")}
    <h4>Import do hry</h4><ol class="prio"><li>Ve hře zmáčkni N (talenty).</li><li>Dole klikni na Import.</li><li>Vlož řetězec a ulož jako nový loadout.</li></ol>
    <p class="note">Buildy: Method.gg, patch 12.1. Po každém patchi je ověř.</p></div>`;
  case "gear": return `${g.gearItems ? gearDoll(g) : ""}<div class="cols">
      <div class="box"><h3>Priorita statů</h3><div class="statbar">${g.stats.map((st,i)=>`<div><span>${i+1}. ${esc(st)}</span><span class="bar"><i style="width:${100-i*16}%"></i></span></div>`).join("")}</div><p class="note">${esc(g.statNote)}</p></div>
      <div class="box"><h3>Gear a zbraň</h3><ul class="clean">${g.gear.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <div class="btns"><a class="btn" href="https://www.raidbots.com" target="_blank" rel="noopener">Raidbots sim ↗</a><a class="btn" href="https://www.icy-veins.com/wow/frost-mage-pve-dps-gear-best-in-slot" target="_blank" rel="noopener">Best in slot ↗</a></div></div></div>`;
  case "buffs": return `
    <div class="box"><h3>Buffy, které si nahazuješ sám</h3><div class="spell-list">${g.spells.filter(x=>x.cat==="buff").map(spellRow).join("")}

      ${spellRow({n:"Ice Barrier",ic:"spell_ice_lament",u:WH(11426),d:"DMG nepřidá, ale díky štítu nemusíš utíkat a sesíláš dál."})}</div>
      <p class="note">Icy Veins už v Midnight neexistuje – jeho roli převzal Ray of Frost.</p></div>
    <div class="box"><h3>Co si koupit: lektvary a jídlo</h3><p class="note" style="margin:-4px 0 12px">${HOVER_HINT} pro herní popis.</p><div class="spell-list">
      ${g.consumables.map((x,i)=>`<div class="spell tt" tabindex="0" data-tt="cons" data-i="${i}">${gicon(x.ic, x.t.slice(0,2), "q"+x.q)}
        <div><div class="ss" style="font-size:11.5px;color:var(--muted)">${esc(x.t)}</div><div class="name" style="color:${QCOL[x.q]}">${esc(x.n)}</div><div class="d">${esc(x.when)}</div></div></div>`).join("")}
    </div><p class="note">Na levelování stačí Arcane Intellect. Flask a jídlo si nech na raidy a Mythic+. Koupíš je v Aukci (Auction House).</p></div>`;
  case "content": return `<div class="cols">
      <div class="box"><h3>Mythic+</h3><ul class="clean">${g.mplus.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box"><h3>Levelování, open world, delves</h3><ul class="clean">${g.solo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box"><h3>PvP</h3><ul class="clean">${g.pvp.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="btns"><a class="btn" href="${L.pvp}" target="_blank" rel="noopener">PvP guide ↗</a></div></div>
      <div class="box"><h3>Časté chyby nováčků</h3><ul class="clean bad">${g.mistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <div class="box"><h3>Doporučené addony</h3><table class="t"><tbody>${g.addons.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</tbody></table><p class="note">Instalace přes aplikaci CurseForge.</p></div>`;
  case "media": return mediaTab(c,s,g);
  }
  return "";
}

const QCOL = {1:"#ffffff",2:"#1eff00",3:"#0070dd",4:"#a335ee"};

/* ---------- GEAR: postava + tooltipy ---------- */

  <line x1="104" y1="40" x2="96" y2="250" stroke="var(--accent)" stroke-width="3" stroke-opacity=".7"/><circle cx="104" cy="36" r="7" fill="var(--accent)"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;1;.6" dur="2.4s" repeatCount="indefinite"/></circle></svg>`;

function gearDoll(g){

      <div class="col r">${DOLL_R.map(k=>slotBtn(by(k))).join("")}</div>
      <div class="weap">${["main","off"].map(k=>slotBtn(by(k))).join("")}</div>
    </div>
    <p class="note">Zdroj: Method.gg, patch 12.1. Staty odpovídají zobrazenému item levelu; ve hře se mění podle obtížnosti a upgradů. Crafted věci si vyrobíš na vyšší item level.</p></div>`;

const TT = (() => {
  const el = document.createElement("div"); el.className="gtt"; el.setAttribute("role","tooltip");
  const scrim = document.createElement("div"); scrim.className="scrim";
  document.body.append(scrim, el);
  let cur=null;
  const hoverable = () => CAN_HOVER;
  function place(x,y){
    const r = el.getBoundingClientRect(), pad=14;
    let L = x+18, T = y+18;
    if (L + r.width > innerWidth - pad) L = x - r.width - 18;
    if (T + r.height > innerHeight - pad) T = Math.max(pad, innerHeight - r.height - pad);
    el.style.left = Math.max(pad,L)+"px"; el.style.top = T+"px";
  }
  function show(btn, x, y, sheet){
    const g = guideOf(); if (!g) return;
    let html = "";
    const kind = btn.dataset.tt;
    if (kind==="item"){ const it = g.gearItems.find(i=>i.slot===btn.dataset.item); if (!it) return; html = tooltipHtml(it, g); }
    else if (kind==="cons"){ const x = g.consumables[+btn.dataset.i]; if (!x) return; html = consTooltipHtml(x); }
    else html = spellTooltipHtml(btn);
    document.querySelectorAll(".tt.act").forEach(b=>b.classList.remove("act"));
    btn.classList.add("act"); cur=btn;
    el.innerHTML = html;
    el.classList.toggle("sheet", !!sheet); scrim.classList.toggle("on", !!sheet);
    if (!sheet){ el.style.bottom=""; if (x==null){ const b=btn.getBoundingClientRect(); x=b.right-10; y=b.top; } place(x,y); }
    requestAnimationFrame(()=>el.classList.add("on"));
  }
  function hide(){ el.classList.remove("on"); scrim.classList.remove("on"); if(cur) cur.classList.remove("act"); cur=null; }
  document.addEventListener("pointerover", e => { const b=e.target.closest(".tt[data-tt]"); if (b && hoverable()) show(b, e.clientX, e.clientY, false); });
  document.addEventListener("pointermove", e => { if (cur && hoverable() && !el.classList.contains("sheet")) place(e.clientX, e.clientY); });
  document.addEventListener("pointerout", e => { const b=e.target.closest(".tt[data-tt]"); if (b && hoverable() && !b.contains(e.relatedTarget)) hide(); });
  document.addEventListener("focusin", e => { const b=e.target.closest(".tt[data-tt]"); if (b && hoverable()) show(b,null,null,false); });
  document.addEventListener("focusout", e => { if (e.target.closest(".tt[data-tt]") && hoverable()) hide(); });
  document.addEventListener("click", e => {
    const b = e.target.closest(".tt[data-tt]");
    if (b && !hoverable()){ if (e.target.closest(".gtt")) return; e.preventDefault(); cur===b ? hide() : show(b,null,null,true); return; }
    if (e.target.closest("[data-ttclose]") || e.target===scrim) hide();
  });
  document.addEventListener("keydown", e => { if (e.key==="Escape") hide(); });
  addEventListener("scroll", () => { if (cur && !el.classList.contains("sheet")) hide(); }, {passive:true});
  return { hide };
})();

/* ---------- BANNER: animovaná scéna ---------- */
let sceneStop = null;
function mountScene(){
  if (sceneStop){ sceneStop(); sceneStop=null; }
  const host = document.querySelector(".banner .scene"); if (!host) return;
  const g = guideOf(), c = clsById(S.cls);
  const cv = host.querySelector("canvas"), ctx = cv.getContext("2d");
  const vid = host.querySelector("video");
  if (vid){ vid.addEventListener("loadeddata", ()=>vid.classList.add("ok")); vid.addEventListener("error", ()=>vid.remove()); const src=vid.querySelector("source"); src && src.addEventListener("error", ()=>vid.remove()); }
  const frost = S.cls==="mage" && S.spec==="frost";
  const [cr,cg,cb] = hexRgb(c.color);
  let W,H,t=0,raf,alive=true, flakes=[], bolts=[], rings=[], shards=[];
  function size(){ const r=host.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    flakes = Array.from({length:Math.round(W/9)},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.8,v:.2+Math.random()*.7,s:Math.random()*6})); }
  const ro = new ResizeObserver(size); ro.observe(host); size();
  const cx = () => W<600 ? W*.8 : W-150, cy = () => H*.52;          // pozice mága
  function mage(x,y,s,pulse){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    // aura
    const au = ctx.createRadialGradient(0,-10,5,0,-10,120); au.addColorStop(0,`rgba(${cr},${cg},${cb},${.22+pulse*.1})`); au.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle=au; ctx.beginPath(); ctx.arc(0,-10,120,0,7); ctx.fill();
    // silueta (originální stylizovaný mág v kápi)
    ctx.fillStyle="rgba(6,8,16,.96)"; ctx.strokeStyle=`rgba(${cr},${cg},${cb},.75)`; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(0,-78); ctx.bezierCurveTo(-16,-78,-22,-60,-22,-48); ctx.lineTo(-30,-38);
    ctx.bezierCurveTo(-38,-10,-44,40,-50,74); ctx.lineTo(50,74); ctx.bezierCurveTo(44,40,38,-10,30,-38);
    ctx.lineTo(22,-48); ctx.bezierCurveTo(22,-60,16,-78,0,-78); ctx.closePath(); ctx.fill(); ctx.stroke();
    // oči pod kápí
    ctx.fillStyle=`rgba(${Math.min(255,cr+80)},${Math.min(255,cg+80)},255,.95)`; ctx.shadowColor=`rgb(${cr},${cg},${cb})`; ctx.shadowBlur=10;
    ctx.fillRect(-8,-54,5,2); ctx.fillRect(3,-54,5,2);
    // hůl
    ctx.shadowBlur=0; ctx.strokeStyle=`rgba(${cr},${cg},${cb},.85)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-40,-70); ctx.lineTo(-30,74); ctx.stroke();
    // krystal
    const k = 7+pulse*4; ctx.fillStyle="#e9fbff"; ctx.shadowColor=`rgb(${cr},${cg},${cb})`; ctx.shadowBlur=24+pulse*20;
    ctx.beginPath(); ctx.moveTo(-41,-70-k*1.6); ctx.lineTo(-41+k*.7,-70); ctx.lineTo(-41,-70+k*.6); ctx.lineTo(-41-k*.7,-70); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function frame(){
    if (!alive) return; t++;
    ctx.clearRect(0,0,W,H);
    const s = Math.min(1.15, H/200), x=cx(), y=cy()+8*Math.sin(t*.02);
    const pulse = (Math.sin(t*.05)+1)/2;
    // podlaha – mrazivý kruh
    ctx.save(); ctx.translate(x, H*.52+74*s); ctx.scale(1,.28);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},.35)`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,90*s,0,7); ctx.stroke();
    ctx.rotate(t*.004); for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(60*s,0); ctx.lineTo(90*s,0); ctx.stroke(); }
    ctx.restore();
    if (frost){
      // každé ~2,6 s Frostbolt, občas Frost Nova
      if (t%160===40) bolts.push({x:x-41*s,y:y-70*s,vx:-(5+Math.random()*2),vy:(Math.random()-.5)*.8,life:0});
      if (t%480===300) rings.push({r:10,a:1});
      bolts.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.life++;
        for(let i=0;i<3;i++) shards.push({x:b.x+Math.random()*6,y:b.y+(Math.random()-.5)*6,vx:1+Math.random()*1.5,vy:(Math.random()-.5)*1.2,a:1});
        const gr=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,18); gr.addColorStop(0,"rgba(240,252,255,1)"); gr.addColorStop(.4,`rgba(${cr},${cg},${cb},.8)`); gr.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(b.x,b.y,18,0,7); ctx.fill(); });
      bolts = bolts.filter(b=>b.x>-30);
      shards.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a-=.03; ctx.fillStyle=`rgba(210,245,255,${Math.max(0,p.a)})`; ctx.fillRect(p.x,p.y,2,2); });
      shards = shards.filter(p=>p.a>0);
      rings.forEach(r=>{ r.r+=4; r.a-=.018; ctx.save(); ctx.translate(x,H*.52+74*s); ctx.scale(1,.3); ctx.strokeStyle=`rgba(200,245,255,${Math.max(0,r.a)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,r.r,0,7); ctx.stroke();
        for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r.r*.8,Math.sin(a)*r.r*.8); ctx.lineTo(Math.cos(a)*r.r,Math.sin(a)*r.r-14); ctx.stroke(); } ctx.restore(); });
      rings = rings.filter(r=>r.a>0);
    }
    mage(x,y,s,pulse);
    // sníh / jiskry
    flakes.forEach(f=>{ f.y+=frost?f.v:-f.v; f.s+=.02; f.x+=Math.sin(f.s)*.3; if(f.y>H+4) f.y=-4; if(f.y<-4) f.y=H+4;
      ctx.fillStyle = frost ? `rgba(230,248,255,${.35+f.r/4})` : `rgba(${cr},${cg},${cb},${.3+f.r/5})`;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); });
    raf = requestAnimationFrame(frame);
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ frame(); cancelAnimationFrame(raf); } else raf = requestAnimationFrame(frame);
  sceneStop = () => { alive=false; cancelAnimationFrame(raf); ro.disconnect(); };
}

/* ---------- ANIMOVANÉ POZADÍ (canvas) ---------- */
const BG = (() => {
  const cv = $("#bg-canvas"), ctx = cv.getContext("2d");
  let W, H, DPR, parts=[], motes=[], t=0, running=true, raf;
  let col=[232,182,76], target=[232,182,76], mx=0, my=0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    const n = Math.round(Math.min(140, W*H/12000));
    parts = Array.from({length:n}, () => spawn(true));
    motes = Array.from({length:6}, (_,i) => ({x:Math.random()*W, y:H*(.3+Math.random()*.7), r:200+Math.random()*260, s:.1+Math.random()*.2, o:Math.random()*6}));
  }
  function spawn(init){ return {x:Math.random()*W, y:init?Math.random()*H:H+10, z:.3+Math.random()*1.2, vy:-(.15+Math.random()*.5), sw:Math.random()*6.28, a:.2+Math.random()*.7}; }
  function rune(cx, cy, R, rot){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    const c = `rgba(${col[0]|0},${col[1]|0},${col[2]|0},`;
    ctx.strokeStyle = c+".13)"; ctx.lineWidth = 1.2;
    [1,.86,.62].forEach(k=>{ ctx.beginPath(); ctx.arc(0,0,R*k,0,Math.PI*2); ctx.stroke(); });
    ctx.strokeStyle = c+".09)";
    for (let i=0;i<2;i++){ ctx.beginPath(); for(let j=0;j<=6;j++){ const a=j/6*Math.PI*2+i*Math.PI/6; const px=Math.cos(a)*R*.86, py=Math.sin(a)*R*.86; j?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.stroke(); }
    ctx.fillStyle = c+".16)";
    for (let i=0;i<24;i++){ const a=i/24*Math.PI*2; ctx.save(); ctx.rotate(a); ctx.translate(R*.93,0); ctx.fillRect(-1,-5,2,10); if(i%3===0){ctx.beginPath();ctx.arc(0,-9,2,0,7);ctx.fill();} ctx.restore(); }
    ctx.restore();
  }
  function frame(){
    t += 1;
    for (let i=0;i<3;i++) col[i] += (target[i]-col[i])*.03;
    const [r,g,b] = col.map(v=>v|0);
    ctx.clearRect(0,0,W,H);
    // mlhy
    motes.forEach(m=>{ const x = m.x + Math.sin(t*.002*m.s+m.o)*80 - mx*20, y = m.y + Math.cos(t*.0015+m.o)*40 - my*12;
      const gr = ctx.createRadialGradient(x,y,0,x,y,m.r); gr.addColorStop(0,`rgba(${r},${g},${b},.07)`); gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle = gr; ctx.fillRect(x-m.r,y-m.r,m.r*2,m.r*2); });
    // runový kruh
    rune(W*.5 - mx*30, H*.42 - my*20, Math.min(W,H)*.42, t*.0006);
    // jiskry / vločky
    parts.forEach((p,i)=>{
      p.y += p.vy*p.z; p.sw += .01; p.x += Math.sin(p.sw)*.3*p.z;
      if (p.y < -10) parts[i] = spawn(false);
      const tw = .6+.4*Math.sin(t*.05+p.sw*3);
      const px = p.x - mx*12*p.z, py = p.y - my*8*p.z, rad = 1.1*p.z;
      ctx.fillStyle = `rgba(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)},${p.a*tw})`;
      ctx.shadowColor = `rgba(${r},${g},${b},1)`; ctx.shadowBlur = 8*p.z;
      ctx.beginPath(); ctx.arc(px,py,rad,0,Math.PI*2); ctx.fill();
    });
    ctx.shadowBlur = 0;
    if (running) raf = requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  addEventListener("pointermove", e => { mx = e.clientX/W-.5; my = e.clientY/H-.5; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else if (running) raf=requestAnimationFrame(frame); });
  resize();
  return {
    start(){ running=true; cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); },
    stop(){ running=false; cancelAnimationFrame(raf); frame(); },
    setColor(c){ target = c.slice(); if(!running) { col=c.slice(); frame(); } },
    reduce
  };
})();

  if (on){
    const v = TRAILERS[0].id;
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v}?autoplay=1&mute=1&loop=1&playlist=${v}&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&disablekb=1&iv_load_policy=3" title="Pozadí – trailer" allow="autoplay; encrypted-media" tabindex="-1"></iframe>`;
    setTimeout(()=>box.classList.add("on"), 1200);
  } else { box.classList.remove("on"); setTimeout(()=>{ if(tVid.getAttribute("aria-pressed")==="false") box.innerHTML=""; }, 1600); }
}
tAnim.onclick = () => setAnim(tAnim.getAttribute("aria-pressed")!=="true");
tVid.onclick = () => setVideo(tVid.getAttribute("aria-pressed")!=="true");
const small = matchMedia("(max-width:720px)").matches;
setAnim(store.get("anim", !BG.reduce));
setVideo(store.get("video", !small && !BG.reduce));

/* ---------- START ---------- */
fromHash(); render();

})();
</script>
</body>
